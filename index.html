<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Monthly Test Report</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>
body {
  font-family: "Segoe UI", Roboto;
  background: #f2f5f9;
  margin: 0;
  padding: 20px;
}

#report {
  width: 794px;
  margin: auto;
  background: white;
}

.page {
  padding: 25px;
  page-break-after: always;
}
.page:last-child {
  page-break-after: auto;
}

.header {
  display: flex;
  align-items: center;
  border-bottom: 2px solid black;
  margin-bottom: 10px;
  padding-bottom: 8px;
}
.logo {
  width: 60px;
  margin-right: 10px;
}

h2, h3 {
  margin: 8px 0;
}

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}
th, td {
  border: 1px solid #ccc;
  padding: 6px;
}
th {
  background: #f0f0f0;
}

.chart-container {
  width: 250px;
  margin: auto;
}
#gradeChart {
  height: 220px !important;
}

button {
  background: #2563eb;
  color: white;
  border: none;
  padding: 10px;
  border-radius: 6px;
  margin-bottom: 10px;
  cursor: pointer;
}
</style>
</head>

<body>

<input type="file" id="fileInput">
<button onclick="downloadPDF()">📄 Download PDF</button>

<div id="report">

<!-- PAGE 1 -->
<div class="page">

<div class="header">
<img src="https://upload.wikimedia.org/wikipedia/commons/thumb/3/3a/Logo_placeholder.svg/768px-Logo_placeholder.svg.png" class="logo">
<div>
<h2>Panangad VHSS</h2>
<p>School Code: 7193</p>
</div>
</div>

<h2 style="text-align:center;">Monthly Test Report</h2>
<p id="meta"></p>

<div id="summary"></div>

<h3>Grade Distribution</h3>
<div class="chart-container">
<canvas id="gradeChart"></canvas>
</div>
<div id="gradeTable"></div>

<div id="insights"></div>

</div>

<!-- PAGE 2 -->
<div class="page">
<h3>Subject Analysis</h3>
<div id="subjectFailure"></div>
<div id="subjectAbsence"></div>
<div id="aplusPanel"></div>
</div>

<!-- PAGE 3 -->
<div class="page">
<h3>Student Analysis</h3>
<div id="rankList"></div>
<div id="absentPanel"></div>

<br><br>
Class Teacher: ____________________<br><br>
Principal: ____________________
</div>

</div>

<script>

const PASS_MARK = 9;
const A_PLUS_MARK = 27;

document.getElementById("fileInput").addEventListener("change", handleFile);

async function handleFile(e){
  const file = e.target.files[0];
  const data = await file.arrayBuffer();
  const wb = XLSX.read(data);
  const sheet = wb.Sheets[wb.SheetNames[0]];
  const raw = XLSX.utils.sheet_to_json(sheet,{header:1});

  const rows = raw.slice(2).filter(r => r[1]);

  const students = rows.map(r => ({
    name:r[1],
    english:parse(r[2]),
    malayalam:parse(r[3]),
    hindi:parse(r[4]),
    business:parse(r[5]),
    accountancy:parse(r[6]),
    economics:parse(r[7]),
    ca:parse(r[8])
  }));

  render(students);
}

function parse(v){
  if(v==="ab"||!v) return {mark:0,isAbsent:true};
  return {mark:Number(v),isAbsent:false};
}

function lang(s){ return !s.malayalam.isAbsent ? s.malayalam : s.hindi; }
function subs(s){ return [s.english,lang(s),s.business,s.accountancy,s.economics,s.ca]; }
function total(s){ return subs(s).reduce((a,b)=>a+b.mark,0); }

function status(s){
  if(subs(s).some(x=>x.isAbsent)) return "ABSENT";
  if(subs(s).every(x=>x.mark>=PASS_MARK)) return "PASS";
  return "FAIL";
}

/* ---------- MAIN ---------- */

function render(students){

  document.getElementById("meta").innerText =
    "Generated on: " + new Date().toLocaleDateString();

  const pass=students.filter(s=>status(s)==="PASS").length;
  const fail=students.filter(s=>status(s)==="FAIL").length;
  const absent=students.filter(s=>status(s)==="ABSENT").length;

  document.getElementById("summary").innerHTML =
    `<b>Total:</b> ${students.length} |
     <b>Pass:</b> ${pass} |
     <b>Fail:</b> ${fail} |
     <b>Absent:</b> ${absent}`;

  renderGrades(students);
  renderInsights(students);
  renderFailure(students);
  renderAbsence(students);
  renderAPlus(students);
  renderRank(students);
  renderAbsent(students);
}

/* ---------- GRADES ---------- */

function grade(t){
  const p=(t/180)*100;
  if(p>=90)return"A+";
  if(p>=80)return"A";
  if(p>=70)return"B";
  if(p>=60)return"C";
  return"D";
}

function renderGrades(students){
  const g={"A+":0,A:0,B:0,C:0,D:0};

  students.forEach(s=>{
    if(status(s)!=="ABSENT") g[grade(total(s))]++;
  });

  document.getElementById("gradeTable").innerHTML =
    Object.entries(g).map(([k,v])=>`${k}: ${v}`).join(" | ");

  new Chart(document.getElementById("gradeChart"),{
    type:"pie",
    data:{
      labels:Object.keys(g),
      datasets:[{data:Object.values(g)}]
    },
    options:{plugins:{legend:{position:"bottom"}}}
  });
}

/* ---------- INSIGHTS ---------- */

function renderInsights(students){
  const pass=students.filter(s=>status(s)==="PASS").length;
  const p=(pass/students.length)*100;

  let txt = p>80?"Overall performance is strong":
            p>50?"Performance is moderate":"Performance needs improvement";

  document.getElementById("insights").innerHTML =
    "<b>Insight:</b> "+txt;
}

/* ---------- FAILURE ---------- */

function renderFailure(students){
  const sub=["english","business","accountancy","economics","ca"];
  let html="<table><tr><th>Subject</th><th>Failure %</th></tr>";

  sub.forEach(k=>{
    const appeared=students.filter(s=>!s[k].isAbsent).length;
    const fail=students.filter(s=>!s[k].isAbsent && s[k].mark<PASS_MARK).length;
    const p=appeared?((fail/appeared)*100).toFixed(1):0;
    html+=`<tr><td>${k}</td><td>${p}%</td></tr>`;
  });

  html+="</table>";
  document.getElementById("subjectFailure").innerHTML=html;
}

/* ---------- ABSENCE ---------- */

function renderAbsence(students){
  const sub=["english","business","accountancy","economics","ca"];
  let html="<table><tr><th>Subject</th><th>Absent</th></tr>";

  sub.forEach(k=>{
    const c=students.filter(s=>s[k].isAbsent).length;
    html+=`<tr><td>${k}</td><td>${c}</td></tr>`;
  });

  html+="</table>";
  document.getElementById("subjectAbsence").innerHTML=html;
}

/* ---------- A+ ---------- */

function getWeak(s){
  const names=["English","Language","Business","Accountancy","Economics","CA"];
  return subs(s).map((x,i)=>x.mark<A_PLUS_MARK?names[i]:null).filter(Boolean);
}

function renderAPlus(students){
  let full=[],pot=[];

  students.forEach(s=>{
    const w=getWeak(s);
    if(w.length===0) full.push(s.name);
    else if(w.length<=2) pot.push({name:s.name,w});
  });

  let html="<b>Full A+:</b> "+(full.join(", ")||"None")+"<br><br>";
  html+="<table><tr><th>Name</th><th>Improve</th></tr>";

  pot.forEach(s=>{
    html+=`<tr><td>${s.name}</td><td>${s.w.join(", ")}</td></tr>`;
  });

  html+="</table>";
  document.getElementById("aplusPanel").innerHTML=html;
}

/* ---------- RANK ---------- */

function renderRank(students){
  const list=students.filter(s=>status(s)!=="ABSENT")
  .map(s=>({name:s.name,total:total(s)}))
  .sort((a,b)=>b.total-a.total);

  let html="<b>Top 5</b><br>";
  list.slice(0,5).forEach((s,i)=> html+=`${i+1}. ${s.name} (${s.total})<br>`);

  html+="<br><b>Bottom 5</b><br>";
  list.slice(-5).forEach(s=> html+=`${s.name} (${s.total})<br>`);

  document.getElementById("rankList").innerHTML=html;
}

/* ---------- IMPROVED ABSENT ---------- */

function getAbsentSubjects(s){
  const subjects = [];

  if(s.english.isAbsent) subjects.push("English");
  if(s.malayalam.isAbsent && s.hindi.isAbsent) subjects.push("Language");
  if(s.business.isAbsent) subjects.push("Business");
  if(s.accountancy.isAbsent) subjects.push("Accountancy");
  if(s.economics.isAbsent) subjects.push("Economics");
  if(s.ca.isAbsent) subjects.push("Computer Application");

  return subjects;
}

function renderAbsent(students){

  const absentees = students
    .map(s => ({
      name: s.name,
      subjects: getAbsentSubjects(s)
    }))
    .filter(s => s.subjects.length > 0);

  absentees.sort((a,b)=> b.subjects.length - a.subjects.length);

  let html = "<table><tr><th>Name</th><th>Absent Subjects</th></tr>";

  absentees.forEach(s => {
    const allAbsent = s.subjects.length === 6;

    html += `
      <tr style="${allAbsent ? 'background:#ffe5e5;' : ''}">
        <td>${s.name}</td>
        <td>${allAbsent ? "All Subjects" : s.subjects.join(", ")}</td>
      </tr>`;
  });

  html += "</table>";

  document.getElementById("absentPanel").innerHTML = html;
}

/* ---------- PDF ---------- */

function downloadPDF(){
  html2pdf().set({
    margin:5,
    filename:"Monthly_Report.pdf",
    html2canvas:{scale:3},
    jsPDF:{unit:"mm",format:"a4"}
  }).from(document.getElementById("report")).save();
}

</script>

</body>
</html>
